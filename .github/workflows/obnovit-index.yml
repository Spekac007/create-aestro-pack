name: Obnoviť index
# Po každom pushi (napr. config upravený cez web GitHubu) prepočíta index.toml,
# aby zmeny naozaj dostali aj hráči. Dá sa spustiť aj ručne.

on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - ".github/**"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: pack
  cancel-in-progress: false

jobs:
  obnovit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Kontrola surových súborov
        run: |
          raw=$(find mods resourcepacks shaderpacks -type f \( -iname '*.jar' -o -iname '*.zip' \) 2>/dev/null || true)
          if [ -n "$raw" ]; then
            echo "$raw"
            echo "::error::V repe sú surové .jar/.zip súbory. Tie hráčom nepôjdu. Zmaž ich a mód pridaj cez Actions → Pridať mód (alebo packwiz na PC)."
            exit 1
          fi

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - name: Nainštalovať packwiz
        run: go install github.com/packwiz/packwiz@latest

      - name: Obnoviť index
        shell: pwsh
        run: |
          packwiz refresh
          ./preserve-configs.ps1
          packwiz refresh

      - name: Uložiť zmenu
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Index je aktuálny, nie je čo robiť."
            exit 0
          fi
          { echo "### Index bol zastaraný, obnovený"; echo '```'; git diff --cached --name-status; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          git commit -m "Automaticky obnoveny index"
          git push

      - name: Obnoviť GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/$GITHUB_REPOSITORY/pages/builds" --silent || echo "::warning::Pages build sa nepodarilo vyžiadať, obnoví sa sám."
